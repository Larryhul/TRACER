name: Bug report
description: Report a reproducible problem in the implementation
title: "[Bug] "
body:
  - type: textarea
    attributes:
      label: Command and observed behavior
      description: Include the exact command, expected result and relevant traceback. Remove credentials.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Python, PyTorch, device and commit SHA
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction inputs
      description: Config, data split, seeds and checkpoint source, if relevant
