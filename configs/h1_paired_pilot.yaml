dataset:
  source: causal_response
  history: 8
  horizon: 12
  dt: 0.4
  causal_response:
    train_base_scenes: 256
    val_base_scenes: 64
    interventions_per_scene: 4
    num_robots: 2
    num_entities: 12
    seed: 81173
    area_size: 10.0
    influence_radius: 4.0
    individual_gain: 1.0
    joint_gain: 3.0
    joint_slowdown: 1.0
    joint_lateral_gain: 1.25
    entity_noise: 0.015
    entity_max_speed: 3.0

model:
  num_robots: 2
  hidden_dim: 96
  num_heads: 4
  dropout: 0.1
  min_log_std: -4.0
  max_log_std: 2.0

training:
  variants: [additive, matched-additive, joint]
  batch_size: 32
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  seed: 2027
  joint_residual_training: false

evaluation:
  interaction_radius: 4.0
  bootstrap_resamples: 10000
  equivalence_bound_dz: 0.2

suite:
  modes: [none, additive, nonlinear]
  seeds: [2027, 2028, 2029]
  output_dir: experiments/pilot/h1_paired_v1/checkpoints
