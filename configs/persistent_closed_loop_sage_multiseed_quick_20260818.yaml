# Exploratory H3 multi-seed interface validation. Not confirmatory evidence.
simulation:
  episodes: 8
  splits: [id, ood]
  windows: 8
  history: 8
  horizon: 12
  num_robots: 3
  num_candidates: 16
  execute_steps: 3
  dt: 0.4
  response_noise: 0.18
  influence_radius: 4.0
  entity_max_speed: 3.0
  data_seed: 518731

candidate_source:
  type: sage
  checkpoint: experiments/pilot/h3_sage_generator_smoke_20260818/synthetic_sage_epoch5.pt
  checkpoint_scope: three_robot_synthetic_smoke
  guided: true
  step_stride: 10
  goal_speed: 1.2
  oversample_factor: 2
  task_prefilter: true
  task_prefix_steps: 3
  goal_direction: entity

planning:
  task_weight: 1.0
  safety_weight: 2.0
  human_weight: 0.6
  comfort_scale: 1.0
  collision_margin: 0.65

belief:
  likelihood_scale: 0.05

suite:
  seeds: [2027, 2028, 2029]
  parallel_seeds: 1
  num_threads_per_seed: 1
  checkpoint_dir: experiments/pilot/h2_p0_v4_multiseed_quick_20260818
  output_dir: experiments/pilot/h3_sage_multiseed_quick_20260818
