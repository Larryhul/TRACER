dataset:
  name: socialgym_navigation
  dt: 0.4
  history: 8
  horizon: 12
  max_entities: 40
  num_robot_proxies: 6
  socialgym:
    source: style
    data_path: ''
    samples: 4096
    train_samples: 8192
    val_samples: 1024
    test_samples: 1024
    num_robots: 6
    num_entities: 40
    scene: mixed
    area_size: 14.0
    corridor_width: 3.0
    doorway_width: 1.8
    roundabout_radius: 2.4
    seed: 31415
    robot_speed: 1.2
    robot_max_speed: 2.4
    entity_noise: 0.035
    role_mix:
      pha: 0.72
      hnaa: 0.22
      ssaa: 0.06
model:
  encoder:
    state_dim: 2
    hidden_dim: 128
    context_dim: 128
    num_layers: 2
    num_heads: 4
    dropout: 0.1
    use_role_embedding: false
    use_typed_relations: false
    use_goal_conditioning: true
    goal_dim: 2
    robot_state_dim: 4
    geometry_dim: 2
    use_robot_current_state: true
    use_geometry_embedding: true
    use_entity_entity_edges: false
    use_robot_robot_edges: true
    relation_attention_type: hgt
    history_encoder_type: lstm
    feature_fusion: concat
    relation_granularity: control
  diffusion:
    horizon: 12
    point_dim: 2
    hidden_dim: 128
    num_layers: 4
    num_heads: 4
    ff_mult: 4
    num_steps: 100
    beta_1: 0.0001
    beta_T: 0.05
    denoiser_type: transformer
    use_agent_attention: true
    guidance_update: mean
    use_graph_context_token: true
  guidance:
    guidance_scale: 0.05
    collision_margin: 0.35
    collision_sigma: 0.8
    max_speed: 3.0
    max_lateral_speed: 0.15
    max_angular_speed: 1.2
    w_collision: 2.0
    w_robot_robot_collision: 1.5
    w_social: 1.0
    w_kinematic: 0.1
    w_goal: 0.3
    goal_tolerance: 0.6
    guidance_grad_clip_norm: 1.0
    guidance_step_clip_norm: 0.05
    guidance_velocity_clip_factor: 1.25
    project_guided_velocity: true
    use_geometry_margin: true
    comfort:
      pha:
        sigma_long: 2.0
        sigma_lat: 1.0
      hnaa:
        sigma_long: 2.6
        sigma_lat: 1.2
      ssaa:
        sigma_long: 1.2
        sigma_lat: 0.7
      unknown_entity:
        sigma_long: 1.5
        sigma_lat: 0.8
training:
  batch_size: 128
  lr: 0.0003
  epochs: 60
  checkpoint_dir: experiments/sage/socialgym/homogeneous
evaluation:
  batch_size: 128
  stride: 10
  samples: 20
  guided: true
  metrics:
  - robot_ade
  - robot_fde
  - entity_ade
  - entity_fde
  - goal_fde
  - goal_success_rate
  - all_goal_success_rate
  - robot_entity_collision_rate
  - robot_robot_collision_rate
  - robot_entity_min_distance
  - robot_robot_min_distance
  - pir
  - svr
  - speed_violation_rate
  - energy
