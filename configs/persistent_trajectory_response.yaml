dataset:
  train_episodes: 1024
  val_episodes: 256
  ood_episodes: 256
  windows: 8
  history: 8
  horizon: 12
  num_robots: 2
  dt: 0.4
  seed: 2027
  response_noise: 0.18
  influence_radius: 4.0
  execute_steps: 3
  entity_max_speed: 3.0
  ood_action_policy: correlated

model:
  hidden_dim: 96
  recurrent_hidden_dim: 64
  dropout: 0.05

training:
  epochs: 25
  batch_size: 32
  lr: 0.0003
  recurrent_lr: 0.001
  weight_decay: 0.0001
  mode_discrimination_weight: 0.0
  mode_temperature: 0.2
  num_workers: 0
  num_threads: 8

evaluation:
  likelihood_scale: 0.2
  confidence_threshold: 0.8

output_dir: experiments/response/persistent_trajectory

suite:
  seeds: [2027, 2028, 2029]
  output_dir: experiments/response/persistent_trajectory_suite
