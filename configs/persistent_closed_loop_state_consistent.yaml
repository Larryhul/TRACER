evaluation:
  mode: closed_loop
  phase: validation
  claim_boundary: synthetic_entity_approach_mechanism_not_navigation

simulation:
  episodes: 16
  splits: [id, ood]
  windows: 8
  history: 8
  horizon: 12
  num_robots: 3
  num_candidates: 16
  execute_steps: 3
  dt: 0.4
  response_noise: 0.18
  influence_radius: 4.0
  entity_max_speed: 3.0
  data_seed: 658731
  task_type: entity_approach

candidate_source:
  type: sage
  checkpoint: experiments/pilot/h3_sage_generator_p0_seed2027/synthetic_sage_epoch5.pt
  checkpoint_scope: upstream_sage_candidate_generator_frozen_epoch5
  guided: true
  step_stride: 10
  guidance_step_clip_norm: 0.1
  goal_speed: 1.2
  oversample_factor: 4
  task_prefilter: true
  task_prefix_steps: 3
  goal_direction: task_goal
  include_task_anchor: true
  task_anchor_speed_scales: [0.4]
  cache_candidate_pools: true
  shared_candidate_pools: false
  diversity_weight: 0.0
  batch_size: 16

planning:
  task_weight: 1.0
  safety_weight: 2.0
  human_weight: 0.6
  comfort_scale: 1.0
  collision_margin: 0.65
  task_steps: 3
  violation_probability_alpha: 0.1
  risk_samples: 32

belief:
  likelihood_scale: 0.05
  calibration_scope: legacy_h2_validation_frozen_correctness_control

suite:
  seeds: [2027, 2028, 2029]
  num_threads_per_seed: 4
  checkpoint_dir: experiments/formal_v2/clean_chain_submission_20260904/h2
  output_dir: experiments/h3_state_consistent_validation_20260905

additional_policies: [recurrent-joint]
