dataset:
  # synthetic and socialgym_style are pipeline checks only. Use
  # socialgym_trajectory with interactive rollout data for paper evidence.
  source: synthetic
  history: 8
  horizon: 12
  dt: 0.4
  max_entities: 20
  num_robot_proxies: 3
  synthetic:
    train_samples: 1024
    val_samples: 256
    num_robots: 3
    num_entities: 20
    layout: mixed
    seed: 2027
  socialgym:
    data_path: raw_data/socialgym_rollouts
    num_robots: 3
    num_entities: 20

model:
  num_robots: 2
  hidden_dim: 128
  num_heads: 4
  dropout: 0.1
  min_log_std: -4.0
  max_log_std: 2.0

training:
  variants: [history, nearest, additive, joint]
  batch_size: 32
  epochs: 20
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  seed: 2027
  output_dir: experiments/response/e0

evaluation:
  interaction_radius: 3.0
