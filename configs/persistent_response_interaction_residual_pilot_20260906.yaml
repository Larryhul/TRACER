dataset:
  train_episodes: 128
  val_episodes: 32
  test_episodes: 32
  ood_episodes: 32
  windows: 8
  history: 8
  horizon: 12
  num_robots: 3
  num_entities: 6
  active_entities: 3
  shared_team_actions: true
  include_interaction_residual: true
  dt: 0.4
  seed: 2027
  data_seed: 718731
  response_noise: 0.18
  influence_radius: 4.0
  execute_steps: 3
  entity_max_speed: 3.0
  cache_samples: true
  ood_action_policy: correlated

model:
  architecture: tracer
  hidden_dim: 64
  recurrent_hidden_dim: 64
  num_heads: 4
  graph_layers: 2
  dropout: 0.05
  geometry_features: true
  dynamic_interaction_features: true
  temporal_pooling: attention
  candidate_uncertainty: true
  set_interactions: true
  zero_init_interaction_residual: true

training:
  epochs: 3
  response_epochs: 3
  recurrent_epochs: 1
  batch_size: 16
  lr: 0.0003
  recurrent_lr: 0.001
  weight_decay: 0.0001
  prefix_loss_weight: 1.0
  interaction_residual_weight: 0.25
  mode_discrimination_weight: 0.0
  mode_temperature: 0.2
  num_workers: 0
  num_threads: 4

evaluation:
  id_split: val
  likelihood_scale: 0.05
  confidence_threshold: 0.8

output_dir: experiments/h3_interaction_residual_pilot_20260906
