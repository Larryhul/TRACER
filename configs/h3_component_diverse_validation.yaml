evaluation:
  mode: closed_loop
  phase: validation
  claim_boundary: candidate_prefilter_diagnostic_not_a_belief_gain

simulation:
  episodes: 32
  splits: [id, ood]
  windows: 8
  history: 8
  horizon: 12
  num_robots: 3
  num_candidates: 16
  execute_steps: 3
  dt: 0.4
  response_noise: 0.18
  influence_radius: 4.0
  entity_max_speed: 3.0
  data_seed: 924613

candidate_source:
  type: sage
  checkpoint: experiments/pilot/h3_sage_generator_p0_seed2027/synthetic_sage_epoch5.pt
  guided: true
  step_stride: 10
  goal_speed: 1.2
  oversample_factor: 4
  task_prefilter: true
  task_prefix_steps: 3
  goal_direction: task_goal
  include_task_anchor: true
  task_anchor_speed_scales: [0.4]
  cache_candidate_pools: true
  shared_candidate_pools: false
  batch_size: 16
  diversity_weight: 0.35

planning:
  task_weight: 1.0
  safety_weight: 2.0
  human_weight: 0.6
  comfort_scale: 1.0
  collision_margin: 0.65
  task_steps: 3
  violation_probability_alpha: 0.1
  risk_samples: 32
