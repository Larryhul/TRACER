dataset:
  source: causal_response
  history: 8
  horizon: 12
  dt: 0.4
  causal_response:
    train_base_scenes: 256
    val_base_scenes: 64
    test_base_scenes: 256
    interventions_per_scene: 4
    num_robots: 2
    num_entities: 12
    seed: 113117
    area_size: 10.0
    influence_radius: 4.0
    individual_gain: 1.0
    joint_gain: 3.0
    joint_slowdown: 1.0
    joint_lateral_gain: 1.25
    entity_noise: 0.015
    entity_max_speed: 3.0

model:
  num_robots: 2
  hidden_dim: 96
  num_heads: 4
  dropout: 0.1
  min_log_std: -4.0
  max_log_std: 2.0

suite:
  modes: [none, additive, nonlinear]
  seeds: [2027, 2028, 2029]
